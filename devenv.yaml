inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Required for languages.rust.channel = "stable" (rustup-like toolchains
  # with cross-compilation targets like wasm32), powered by rust-overlay.
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
